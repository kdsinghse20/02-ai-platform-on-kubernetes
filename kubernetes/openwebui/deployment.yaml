apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: ai-platform
spec:
  replicas: 1

  selector:
    matchLabels:
      app: open-webui

  template:
    metadata:
      labels:
        app: open-webui

    spec:
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:main

          ports:
            - containerPort: 8080
              protocol: TCP

          env:
            - name: OLLAMA_BASE_URL
              value: "http://ollama:11434"

          resources:
            requests:
              cpu: "250m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "4Gi"

          volumeMounts:
            - name: open-webui-data
              mountPath: /app/backend/data

      volumes:
        - name: open-webui-data
          persistentVolumeClaim:
            claimName: open-webui-data